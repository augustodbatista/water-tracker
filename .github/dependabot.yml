version: 2
updates:
  # Auditoria de dependencias fora do build: um PR quando ha atualizacao, em vez de
  # uma CI vermelha por indisponibilidade de rede da base de CVEs.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

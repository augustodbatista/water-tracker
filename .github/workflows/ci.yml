name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false de proposito. Quando quebrar so em um SO (separador de path,
      # line ending, encoding), quero ver os dois resultados, nao um cancelado.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, lint, test, SAST and coverage gate
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
            target/spotbugsXml.xml
          if-no-files-found: ignore
